packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  # toolchain — latest majors (as of upgrade)
  "@types/node": ^26.1.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: ^0.2.6
  # server / shared
  zod: ^4.4.3
  hono: ^4.12.33
  "@hono/node-server": ^2.0.12
  "@hono/zod-validator": ^0.9.0
  cheerio: ^1.2.0
  ky: ^2.0.2
  # web
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  zustand: ^5.0.14
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  shadcn: ^4.16.0
  class-variance-authority: ^0.7.1
  tw-animate-css: ^1.4.0
  radix-ui: ^1.6.7
  lucide-react: ^1.28.0
  "@fontsource-variable/geist": ^5.3.0
  vite-plugin-pwa: ^1.3.0
  workbox-window: ^7.4.1

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - hono@4.12.33
